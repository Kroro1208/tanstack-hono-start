version: 2
updates:
  - package-ecosystem: "npm"
    directory: "/"
    schedule:
      interval: "weekly"
    open-pull-requests-limit: 10
    groups:
      # Group React-related updates together (critical for security patches)
      react:
        patterns:
          - "react*"
          - "@types/react*"
      # Group TanStack updates
      tanstack:
        patterns:
          - "@tanstack/*"
      # Group testing dependencies
      testing:
        patterns:
          - "vitest*"
          - "@vitest/*"
          - "jest*"
          - "@types/jest"
          - "@testing-library/*"
      # Group TypeScript and ESLint
      dev-tools:
        patterns:
          - "typescript"
          - "eslint*"
          - "@typescript-eslint/*"
    labels:
      - "dependencies"
      - "automated"

  # Update CLI package separately
  - package-ecosystem: "npm"
    directory: "/packages/cli"
    schedule:
      interval: "weekly"
    open-pull-requests-limit: 5
    labels:
      - "dependencies"
      - "cli"

  - package-ecosystem: "github-actions"
    directory: "/"
    schedule:
      interval: "monthly"
    labels:
      - "dependencies"
      - "github-actions"
